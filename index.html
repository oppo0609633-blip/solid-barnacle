<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copy Hub</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#101827,#18233b);
  color:white;
}

.container{
  width:min(900px,92%);
  margin:auto;
  padding:35px 0;
}

.header{
  text-align:center;
  margin-bottom:25px;
}

.logo{
  font-size:45px;
  margin-bottom:8px;
}

h1{
  margin:0;
  font-size:34px;
}

.subtitle{
  color:#b8c2d6;
  margin-top:8px;
}

.card{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  backdrop-filter:blur(10px);
}

textarea{
  width:100%;
  min-height:180px;
  resize:vertical;
  border:0;
  outline:none;
  border-radius:12px;
  padding:16px;
  font-size:16px;
  background:#0b1220;
  color:white;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:14px;
  flex-wrap:wrap;
}

button{
  flex:1;
  min-width:130px;
  padding:13px 18px;
  border:0;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  background:#2563eb;
  color:white;
}

button:hover{
  opacity:.9;
}

.clear{
  background:#dc2626;
}

.status{
  text-align:center;
  margin-top:14px;
  color:#9fe3b1;
  min-height:22px;
}

.footer{
  text-align:center;
  color:#8995aa;
  margin-top:25px;
  font-size:14px;
}

@media(max-width:600px){
  h1{
    font-size:28px;
  }

  .container{
    padding:25px 0;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">📋</div>
    <h1>Copy Hub</h1>
    <div class="subtitle">เว็บไซต์คัดลอกข้อความง่าย ๆ</div>
  </div>

  <div class="card">

    <textarea id="textBox"
      placeholder="พิมพ์หรือวางข้อความที่นี่..."></textarea>

    <div class="buttons">
      <button onclick="copyText()">📋 คัดลอก</button>
      <button onclick="pasteText()">📥 วาง</button>
      <button class="clear" onclick="clearText()">🗑️ ล้าง</button>
    </div>

    <div class="status" id="status"></div
