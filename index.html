<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copy Hub</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#101827,#18233a);
  color:white;
}

.container{
  width:min(900px,92%);
  margin:auto;
  padding:35px 0;
}

h1{
  text-align:center;
  margin:0;
  font-size:36px;
}

.subtitle{
  text-align:center;
  color:#b9c3d4;
  margin:10px 0 25px;
}

.card{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  border-radius:18px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

textarea{
  width:100%;
  min-height:180px;
  resize:vertical;
  border:0;
  outline:0;
  border-radius:12px;
  padding:15px;
  font-size:16px;
  font-family:monospace;
  background:#0b1220;
  color:#fff;
}

button{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#4f8cff;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.status{
  text-align:center;
  margin-top:12px;
  color:#8ff0a4;
  min-height:20px;
}

.footer{
  text-align:center;
  color:#8792a6;
  margin-top:25px;
  font-size:14px;
}
</style>
</head>

<body>

<div class="container">

  <h1>📋 Copy Hub</h1>
  <div class="subtitle">
    เว็บไซต์สำหรับเก็บและคัดลอกข้อความ
  </div>

  <div class="card">
    <h2>ข้อความที่ต้องการคัดลอก</h2>

    <textarea id="textBox"
      placeholder="พิมพ์หรือวางข้อความของคุณที่นี่..."></textarea>

    <button onclick="copyText()">
      📋 คัดลอกข้อความ
    </button>

    <div class="status" id="status"></div>
  </div>

  <div class="card">
    <h2>วิธีใช้งาน</h2>
    <p>1. ใส่ข้อความลงในช่องด้านบน</p>
    <p>2. กดปุ่ม “คัดลอกข้อความ”</p>
    <p>3. นำข้อความไปวางได้ทันที</p>
  </div>

  <div class="footer">
    Copy Hub © 2026
  </div>

</div>

<script>
function copyText(){

  const box = document.getElementById("textBox");
  const status = document.getElementById("status");

  if(!box.value.trim()){
    status.textContent = "⚠️ กรุณาใส่ข้อความก่อน";
    return;
  }

  navigator.clipboard.writeText(box.value)
    .then(function(){
      status.textContent = "✅ คัดลอกข้อความแล้ว!";
    })
    .catch(function(){

      box.select();
      document.execCommand("copy");

      status.textContent = "✅ คัดลอกข้อความแล้ว!";
    });
}
</script>

</body>
</html>
